name: Bug report
description: Something does not work as documented
body:
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: pihole
    attributes:
      label: Pi-hole / FTL version
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Pi-hole Extended version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and logs
      description: Attach the downloaded diagnostics file (host, password and clients are redacted). Do not paste passwords, session IDs or DNS query logs.
