[project]
name = "pihole-extended-dev"
version = "0.0.0"
description = "Development and test environment for Pi-hole Extended"
requires-python = ">=3.12,<3.13"
dependencies = ["homeassistant==2025.1.4"]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-aiohttp==1.1.1",
  "pytest-freezer==0.4.9",
  "pytest-socket==0.8.1",
  "trustme==1.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
