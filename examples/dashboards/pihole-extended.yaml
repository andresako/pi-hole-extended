title: Pi-hole Extended
views:
  - title: Activity
    path: activity
    icon: mdi:chart-timeline-variant
    cards:
      # Everything below the type is optional: leave it out and choose the devices
      # in the card editor instead.
      - type: custom:phe-activity-card
        entities:
          - sensor.phe_192_0_2_21_consultas_dns
          - sensor.phe_192_0_2_34_consultas_dns
          - sensor.phe_192_0_2_47_consultas_dns
        bucket: 30m
        span: 1d
        chart_type: line
      - type: entities
        title: Unusual activity
        entities:
          - binary_sensor.phe_192_0_2_21_actividad_inusual
          - binary_sensor.phe_192_0_2_34_actividad_inusual
          - binary_sensor.phe_192_0_2_47_actividad_inusual
      - type: history-graph
        title: Queries per minute · last 6 hours
        hours_to_show: 6
        entities:
          - sensor.phe_192_0_2_21_consultas_en_el_ultimo_minuto
          - sensor.phe_192_0_2_34_consultas_en_el_ultimo_minuto
          - sensor.phe_192_0_2_47_consultas_en_el_ultimo_minuto
  - title: Diagnostics
    path: diagnostics
    icon: mdi:heart-pulse
    cards:
      # Diagnostic entity IDs follow the language Home Assistant used when the
      # entry was created: copy yours from Settings → Devices & services → Entities.
      - type: entities
        title: Integration status
        entities:
          - entity: sensor.pi_hole_192_0_2_2_diagnostico_estado_de_comunicacion
            name: Communication status
          - entity: sensor.pi_hole_192_0_2_2_diagnostico_ultima_lectura_correcta
            name: Last successful read
          - entity: sensor.pi_hole_192_0_2_2_diagnostico_ultima_consulta_observada
            name: Last query observed
          - entity: sensor.pi_hole_192_0_2_2_diagnostico_cobertura_de_ingesta
            name: Ingestion coverage
  - title: Device
    path: device
    icon: mdi:lan
    # One view per device, generated from the device's own entities: no entity
    # IDs to copy. Use `device` (a device ID) or `entity` (the device's DNS
    # queries counter). Add one view like this for each device you want.
    strategy:
      type: custom:phe-device
      entity: sensor.phe_192_0_2_21_consultas_dns
