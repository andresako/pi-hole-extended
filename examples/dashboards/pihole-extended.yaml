title: Pi-hole Extended
views:
  - title: Activity
    path: activity
    icon: mdi:chart-timeline-variant
    cards:
      # Everything below the type is optional: leave it out and choose the devices
      # in the card editor instead.
      - type: custom:phe-activity-card
        entities:
          - sensor.phe_192_0_2_21_dns_queries
          - sensor.phe_192_0_2_34_dns_queries
          - sensor.phe_192_0_2_47_dns_queries
        bucket: 30m
        span: 1d
        chart_type: line
      - type: entities
        title: Unusual activity
        entities:
          - binary_sensor.phe_192_0_2_21_unusual_activity
          - binary_sensor.phe_192_0_2_34_unusual_activity
          - binary_sensor.phe_192_0_2_47_unusual_activity
      - type: history-graph
        title: Queries per minute · last 6 hours
        hours_to_show: 6
        entities:
          - sensor.phe_192_0_2_21_queries_last_minute
          - sensor.phe_192_0_2_34_queries_last_minute
          - sensor.phe_192_0_2_47_queries_last_minute
  - title: Diagnostics
    path: diagnostics
    icon: mdi:heart-pulse
    cards:
      # Diagnostic entity IDs follow the language Home Assistant used when the
      # entry was created: copy yours from Settings → Devices & services → Entities.
      - type: entities
        title: Integration status
        entities:
          - entity: sensor.pi_hole_192_0_2_2_diagnostics_communication_status
            name: Communication status
          - entity: sensor.pi_hole_192_0_2_2_diagnostics_last_successful_read
            name: Last successful read
          - entity: sensor.pi_hole_192_0_2_2_diagnostics_last_query_observed
            name: Last query observed
          - entity: sensor.pi_hole_192_0_2_2_diagnostics_ingestion_coverage
            name: Ingestion coverage
  - title: Device
    path: device
    icon: mdi:lan
    cards:
      # A normal view you can edit: add one live card per device. It finds the
      # device's other entities itself, so `entity` (the DNS queries counter) is
      # all it needs. Everything else is optional and can be set in the card editor,
      # which only writes the options you change.
      - type: custom:phe-live-card
        entity: sensor.phe_192_0_2_21_dns_queries
        title: Kitchen speaker
