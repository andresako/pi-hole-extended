title: Pi-hole Extended Dashboard
views:
  - title: Summary
    path: summary
    icon: mdi:view-dashboard
    cards:
      - type: markdown
        content: |
          ## Pi-hole Extended

          Show one instance per view. Query totals accumulate from setup onward;
          the graph uses HA's recording time, not Pi-hole's original event time.
      - type: entities
        title: Cumulative queries
        entities:
          # Replace each ID with the current entity ID from Settings → Entities.
          - entity: sensor.replace_with_client_1_queries
            name: Client 1
          - entity: sensor.replace_with_client_2_queries
            name: Client 2
          - entity: sensor.replace_with_client_3_queries
            name: Client 3
      - type: markdown
        content: |
          ### Activity observed by HA · last minute

          Rolling count of queries observed by the integration. This is not Pi-hole's
          historical hourly volume. It updates with each poll; if the polling interval
          exceeds one minute, the value may be stale until the next poll.

          {% set count = state_attr('sensor.replace_with_client_1_queries', 'queries_observed_last_minute') %}
          - Client 1: {{ count if count is not none else 'Unavailable' }}
          {% set count = state_attr('sensor.replace_with_client_2_queries', 'queries_observed_last_minute') %}
          - Client 2: {{ count if count is not none else 'Unavailable' }}
          {% set count = state_attr('sensor.replace_with_client_3_queries', 'queries_observed_last_minute') %}
          - Client 3: {{ count if count is not none else 'Unavailable' }}
      - type: entities
        title: Blocked v1 · cumulative
        entities:
          # Static comparison of up to five clients from the same instance.
          - entity: sensor.replace_with_client_1_blocked_v1
            name: Client 1
          - entity: sensor.replace_with_client_2_blocked_v1
            name: Client 2
          - entity: sensor.replace_with_client_3_blocked_v1
            name: Client 3
      - type: history-graph
        title: Cumulative queries · last 24 hours
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.replace_with_client_1_queries
            name: Client 1
          - entity: sensor.replace_with_client_2_queries
            name: Client 2
          - entity: sensor.replace_with_client_3_queries
            name: Client 3
  - title: Clients
    path: clients
    icon: mdi:devices
    cards:
      - type: markdown
        content: >
          Replace the example entities with your clients' entities. Add or remove rows
          manually to keep access to inactive and unknown clients.
      - type: entities
        title: Clients · cumulative queries
        entities:
          - entity: sensor.replace_with_client_1_queries
            name: Client 1 · observed queries
          - entity: sensor.replace_with_client_2_queries
            name: Client 2 · observed queries
          - entity: sensor.replace_with_client_3_queries
            name: Client 3 · observed queries
          - entity: sensor.replace_with_client_4_queries
            name: Client 4 · observed queries
          - entity: sensor.replace_with_unknown_client_queries
            name: Unknown · DNS
  - title: Details
    path: details
    icon: mdi:magnify
    cards:
      - type: markdown
        content: >
          Select an entity to open Home Assistant's standard entity dialog and view its
          available history and attributes. This view does not provide a complete DNS
          query table, interactive search, or coordinated filters.
      - type: entities
        title: Client · observed counters
        entities:
          - entity: sensor.replace_with_client_1_queries
            name: Client 1 · observed queries
          - entity: sensor.replace_with_client_1_allowed_v1
            name: Client 1 · allowed (v1)
          - entity: sensor.replace_with_client_1_blocked_v1
            name: Client 1 · blocked (v1)
          - entity: sensor.replace_with_client_1_provisional_v1
            name: Client 1 · provisional (v1)
          - entity: sensor.replace_with_client_2_queries
            name: Client 2 · observed queries
          - entity: sensor.replace_with_client_2_allowed_v1
            name: Client 2 · allowed (v1)
          - entity: sensor.replace_with_client_2_blocked_v1
            name: Client 2 · blocked (v1)
          - entity: sensor.replace_with_client_2_provisional_v1
            name: Client 2 · provisional (v1)
  - title: Diagnostics
    path: diagnostics
    icon: mdi:heart-pulse
    cards:
      - type: markdown
        content: >
          Replace these entities with the four diagnostic entities for one entry.
          Communication status, freshness, coverage, and persistence are separate signals.
          A successful read does not confirm that Recorder saved every event.
      - type: entities
        title: Integration status
        entities:
          - entity: sensor.replace_with_entry_communication_status
            name: Communication status
          - entity: sensor.replace_with_entry_last_successful_read
            name: Last successful read
          - entity: sensor.replace_with_entry_last_query_observed
            name: Last query observed
          - entity: sensor.replace_with_entry_ingestion_coverage
            name: Ingestion coverage
      - type: history-graph
        title: Status and coverage · last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.replace_with_entry_communication_status
            name: Status
          - entity: sensor.replace_with_entry_ingestion_coverage
            name: Coverage
